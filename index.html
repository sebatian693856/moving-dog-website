<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Dog Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: white;
            font-size: 3em;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .dog {
            position: absolute;
            bottom: 100px;
            font-size: 100px;
            animation: walk 4s infinite linear;
        }

        @keyframes walk {
            0% {
                left: -100px;
                transform: scaleX(1);
            }
            100% {
                left: 100%;
                transform: scaleX(1);
            }
        }

        .tail {
            position: absolute;
            display: inline-block;
            animation: wagTail 0.3s infinite;
        }

        @keyframes wagTail {
            0%, 100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(20deg);
            }
        }

        .legs {
            display: inline-block;
            animation: runLegs 0.4s infinite;
        }

        @keyframes runLegs {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .info {
            position: absolute;
            top: 30px;
            color: white;
            font-size: 1.2em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐕 Watch the Dog Run! 🐕</h1>
        <div class="dog">
            <span class="legs">🐕</span>
        </div>
    </div>

    <script>
        // Create multiple dogs for extra fun
        const container = document.querySelector('.container');
        
        function createDog() {
            const dog = document.createElement('div');
            dog.className = 'dog';
            dog.innerHTML = '<span class="legs">🐕</span>';
            dog.style.bottom = Math.random() * 400 + 50 + 'px';
            dog.style.animationDuration = (Math.random() * 2 + 3) + 's';
            dog.style.fontSize = (Math.random() * 40 + 60) + 'px';
            dog.style.opacity = Math.random() * 0.5 + 0.5;
            container.appendChild(dog);

            // Remove dog after animation completes
            setTimeout(() => {
                dog.remove();
            }, (Math.random() * 2 + 3) * 1000);
        }

        // Create a new dog every 2 seconds
        setInterval(createDog, 2000);
        
        // Create initial dog
        createDog();
    </script>
</body>
</html>
